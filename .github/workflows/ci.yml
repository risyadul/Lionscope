name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  js:
    name: Server, dashboard, protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Builds the dashboard, then bundles the server into cli/dist with the dashboard next to it.
      - run: npm run build:cli
      - name: Smoke-test the npm package
        run: |
          node cli/dist/lionscope.mjs --version
          node cli/dist/lionscope.mjs --help
          # No absolute build paths in the bundle (`! grep` would not fail the step under bash -e).
          if grep -q "/Users/\|/home/runner" cli/dist/lionscope.mjs; then echo "absolute path in bundle"; exit 1; fi
          node cli/dist/lionscope.mjs --port 8799 --device-port 8798 --adb /nonexistent &
          server=$!
          for _ in $(seq 1 50); do curl -sf -o /dev/null http://localhost:8799/ && break; sleep 0.2; done
          curl -sf http://localhost:8799/ | grep -q Lionscope
          kill "$server"
          cd cli && npm pack --dry-run --ignore-scripts

  android:
    name: Android SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      # ubuntu-latest ships an Android SDK (ANDROID_HOME) with accepted licenses; AGP fetches missing platforms.
      - name: Test SDK, build no-op and sample
        working-directory: android-sdk
        run: ./gradlew :lionscope:test :lionscope-noop:assemble :sample:assembleDebug :ui-helper:test --no-daemon
      # The committed UI helper jar must be what its sources build (same JDK 17 toolchain and build-tools).
      - name: Rebuild the UI helper and compare it with the vendored jar
        working-directory: android-sdk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-36" > /dev/null
          ./gradlew :ui-helper:helperJar --no-daemon
          expected=$(cut -d' ' -f1 ../server/vendor/lionscope-ui-helper-v1.jar.sha256)
          actual=$(sha256sum ui-helper/build/helper/lionscope-ui-helper-v1.jar | cut -d' ' -f1)
          echo "vendored $expected, built $actual"
          if [ "$expected" != "$actual" ]; then echo "Run ./gradlew :ui-helper:vendor and commit the result"; exit 1; fi
