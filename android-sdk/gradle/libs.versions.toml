[versions]
agp = "8.9.1"
kotlin = "2.2.0"
# Compile-only stdlib for the SDK: the host app provides its own (Kotlin 2.0+).
kotlinStdlib = "2.0.0"
# Sample app stdlib: AGP 8.9's D8 cannot parse Kotlin 2.2 metadata (warning spam in mergeExtDex).
kotlinStdlibApp = "2.0.21"
startup = "1.1.1"
fragment = "1.4.1"
appcompat = "1.4.1"
material = "1.5.0"
recyclerview = "1.2.1"
viewpager = "1.0.0"
asynclayoutinflater = "1.0.0"
junit = "4.13.2"
# The SDK compiles against the oldest Compose UI / Navigation it reads (compileOnly, detected at runtime).
composeUiSdk = "1.6.8"
navigationSdk = "2.7.7"
# Sample app only.
composeBom = "2025.09.01"
activityCompose = "1.8.2"
navigationCompose = "2.7.7"
# compileOnly in both SDK artifacts: the app brings its own OkHttp (4.x or 5.x).
okhttp = "4.12.0"
# The second unit-test run (testOkHttp5) puts this OkHttp, with the Okio and Kotlin stdlib it needs, on the classpath.
okhttp5 = "5.4.0"
# compileOnly in the SDK (detected at runtime; the app brings its own RxJava 2.x). The sample's Rx demo uses both.
rxjava2 = "2.2.21"
# Sample app only (the Rx and coroutine stall demos).
rxandroid2 = "2.1.1"
coroutines = "1.8.1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinStdlib" }
kotlin-stdlib-app = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlinStdlibApp" }
androidx-startup = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-viewpager = { module = "androidx.viewpager:viewpager", version.ref = "viewpager" }
androidx-asynclayoutinflater = { module = "androidx.asynclayoutinflater:asynclayoutinflater", version.ref = "asynclayoutinflater" }
material = { module = "com.google.android.material:material", version.ref = "material" }
junit = { module = "junit:junit", version.ref = "junit" }
compose-ui-sdk = { module = "androidx.compose.ui:ui", version.ref = "composeUiSdk" }
# SDK tests only: real modifier nodes (background, border, text) for the draws classification.
compose-foundation-sdk = { module = "androidx.compose.foundation:foundation", version.ref = "composeUiSdk" }
navigation-runtime-sdk = { module = "androidx.navigation:navigation-runtime", version.ref = "navigationSdk" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
okhttp5 = { module = "com.squareup.okhttp3:okhttp-jvm", version.ref = "okhttp5" }
okhttp5-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp5" }
rxjava2 = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rxjava2" }
rxandroid2 = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rxandroid2" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
